<!DOCTYPE html>
<html>
<head>
    <title>CSS Gradients</title>

    <style>
        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 50px;
        }

        .item {
            text-align: center;
        }

        .box {
            width: 250px;
            height: 200px;
            border: 2px solid black;
        }

        .linear {
            background: linear-gradient(to right, black, red);
        }

        .radial {
            background: radial-gradient(circle, red, black);
        }

        .conic {
            background: conic-gradient(red, black);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="item">
            <h2>Linear Gradient</h2>
            <div class="box linear"></div>
        </div>

        <div class="item">
            <h2>Radial Gradient</h2>
            <div class="box radial"></div>
        </div>

        <div class="item">
            <h2>Conic Gradient</h2>
            <div class="box conic"></div>
        </div>

    </div>

</body>
</html>
